name: Release

# Build installable `aid-lean` binaries for each supported platform and attach
# them to the GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.0`),
# or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # LeanAID is a command-line tool (no Windows build is supported); the
          # platforms are Linux and macOS, matching the README.
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-14          # Apple silicon
            target: macos-arm64
          - os: macos-13          # Intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # elan + the toolchain pinned in lean-toolchain, with the .lake cache.
      - name: Build the aid-lean binary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "aid-lean"
          use-github-cache: true

      # Cheap smoke test: replays oref0's own test cases. The heavy differential
      # tests (Node.js + an oref0 checkout, hours of CPU) are deliberately not run
      # in CI or here.
      - name: Smoke test
        run: .lake/build/bin/aid-lean selftest

      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          name="aid-lean-${ver}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp .lake/build/bin/aid-lean "dist/${name}/"
          cp README.md LICENSE NOTICE.md "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            aid-lean-*.tar.gz
            aid-lean-*.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aid-lean-*.tar.gz
            dist/aid-lean-*.tar.gz.sha256
          generate_release_notes: true
