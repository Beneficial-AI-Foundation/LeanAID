name: Verification Comment
# Posts the sticky Verification Delta PR comment after CI completes. The logic
# lives in the veritooling reusable workflow. The workflow_run trigger runs in
# the base-repo context, so it can comment on fork PRs.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  comment:
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: Beneficial-AI-Foundation/veritooling/.github/workflows/verification-comment.yml@v1
    with:
      # Comment only on new sorries in the hand-written libraries.
      include-prefix: "LeanAID,App"
