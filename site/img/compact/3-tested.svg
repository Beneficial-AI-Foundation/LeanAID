<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -4 960 384" width="960" height="384" role="img" aria-label="Tested against oref0: the same input goes to oref0 and lean-oref0. oref0's own test cases: 148 of 148 identical. Random inputs: 100,000 of 100,000 identical. 30 virtual patients over 12 hours of computing: 220,608 of 220,608 decisions identical.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8794"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#3ee08f" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #eef2f6; }
    .box { fill: #10151c; stroke: #3a4350; stroke-width: 2; }
    .main { fill: #0c2a1d; stroke: #3ee08f; stroke-width: 2.5; filter: url(#glow); }
    .hot { fill: #10151c; stroke: #ff9f43; stroke-width: 2; }
    .h { font-size: 28px; font-weight: 700; fill: #3ee08f; letter-spacing: 0.5px; }
    .t { font-size: 26px; font-weight: 700; }
    .tg { font-size: 26px; font-weight: 700; fill: #3ee08f; }
    .s { font-size: 20px; fill: #a7b0bd; }
    .i { font-size: 22px; }
    .n { font-size: 28px; font-weight: 700; fill: #3ee08f; }
    .nm { font-size: 28px; font-weight: 700; fill: #a7b0bd; }
    .no { font-size: 28px; font-weight: 700; fill: #ff9f43; }
    .big { font-size: 40px; font-weight: 700; fill: #3ee08f; }
    .bigo { font-size: 34px; font-weight: 700; fill: #ff9f43; }
    .pill { font-size: 18px; font-weight: 700; }
    .line { stroke: #7d8794; stroke-width: 2.5; fill: none; }
  </style>
  <text class="h" x="0" y="30" text-anchor="start">Tested against oref0</text>
  <rect class="box" x="0" y="76" width="190" height="60" rx="12"/>
  <text class="t" x="95.0" y="115.0" text-anchor="middle">same input</text>
  <rect class="box" x="300" y="52" width="220" height="52" rx="12"/>
  <text class="t" x="410.0" y="87.0" text-anchor="middle">oref0</text>
  <rect class="main" x="300" y="112" width="220" height="52" rx="12"/>
  <text class="tg" x="410.0" y="147.0" text-anchor="middle">lean-oref0</text>
  <path class="line" d="M190 98 L292 80" marker-end="url(#head)"/>
  <path class="line" d="M190 114 L292 136" marker-end="url(#head)"/>
  <text class="t" x="560" y="122" text-anchor="start">same output?</text>
  <text class="s" x="560" y="152" text-anchor="start">every number, word for word</text>
  <rect class="box" x="0" y="196" width="300" height="170" rx="12"/>
  <text class="s" x="20" y="234" text-anchor="start">oref0’s own test cases</text>
  <text class="big" x="20" y="292" text-anchor="start">148</text>
  <text class="s" x="20" y="330" text-anchor="start">of 148 identical</text>
  <rect class="box" x="320" y="196" width="300" height="170" rx="12"/>
  <text class="s" x="340" y="234" text-anchor="start">random inputs</text>
  <text class="big" x="340" y="292" text-anchor="start">100,000</text>
  <text class="s" x="340" y="330" text-anchor="start">of 100,000 identical</text>
  <rect class="box" x="640" y="196" width="300" height="170" rx="12"/>
  <text class="s" x="660" y="234" text-anchor="start">30 virtual patients, 12 h</text>
  <text class="big" x="660" y="292" text-anchor="start">220,608</text>
  <text class="s" x="660" y="330" text-anchor="start">of 220,608 decisions identical</text>

</svg>
