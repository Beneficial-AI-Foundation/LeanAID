<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -4 2004 898" width="2004" height="898" role="img" aria-label="LeanAID in four diagrams">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8794"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#3ee08f" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #eef2f6; }
    .box { fill: #10151c; stroke: #3a4350; stroke-width: 2; }
    .main { fill: #0c2a1d; stroke: #3ee08f; stroke-width: 2.5; filter: url(#glow); }
    .hot { fill: #10151c; stroke: #ff9f43; stroke-width: 2; }
    .h { font-size: 28px; font-weight: 700; fill: #b69cff; letter-spacing: 0.5px; }
    .t { font-size: 26px; font-weight: 700; }
    .tg { font-size: 26px; font-weight: 700; fill: #3ee08f; }
    .s { font-size: 20px; fill: #a7b0bd; }
    .i { font-size: 22px; }
    .n { font-size: 28px; font-weight: 700; fill: #3ee08f; }
    .nm { font-size: 28px; font-weight: 700; fill: #a7b0bd; }
    .no { font-size: 28px; font-weight: 700; fill: #ff9f43; }
    .big { font-size: 40px; font-weight: 700; fill: #3ee08f; }
    .bigs { font-size: 34px; font-weight: 700; fill: #3ee08f; }
    .bigo { font-size: 34px; font-weight: 700; fill: #ff9f43; }
    .pill { font-size: 18px; font-weight: 700; }
    .line { stroke: #7d8794; stroke-width: 2.5; fill: none; }
  </style>
<g transform="translate(0 0)">
  <text class="h" x="0" y="30" text-anchor="start">Automated insulin delivery (AID)</text>
  <text class="s" x="940" y="30" text-anchor="end">every 5 minutes</text>
  <rect class="box" x="0" y="60" width="220" height="90" rx="12"/>
  <text class="t" x="110.0" y="101.0" text-anchor="middle">Sensor</text>
  <text class="s" x="110.0" y="129.0" text-anchor="middle">reads glucose</text>
  <rect class="main" x="350" y="60" width="240" height="90" rx="12"/>
  <text class="tg" x="470.0" y="101.0" text-anchor="middle">Controller</text>
  <text class="s" x="470.0" y="129.0" text-anchor="middle">decides the dose</text>
  <rect class="box" x="720" y="60" width="220" height="90" rx="12"/>
  <text class="t" x="830.0" y="101.0" text-anchor="middle">Pump</text>
  <text class="s" x="830.0" y="129.0" text-anchor="middle">delivers insulin</text>
  <path class="line" d="M220 105 H342" marker-end="url(#head)"/>
  <text class="s" x="285" y="95" text-anchor="middle">glucose</text>
  <path class="line" d="M590 105 H712" marker-end="url(#head)"/>
  <text class="s" x="655" y="95" text-anchor="middle">insulin</text>
  <path class="line" d="M470 212 V158" marker-end="url(#head)"/>
  <text class="s" x="482" y="190" text-anchor="start">runs</text>
  <rect class="main" x="190" y="214" width="560" height="150" rx="12"/>
  <text x="470" y="252" text-anchor="middle"><tspan class="tg">oref0</tspan><tspan class="s" dx="14">from the OpenAPS project</tspan></text>
  <line x1="214" y1="270" x2="726" y2="270" stroke="#3ee08f" stroke-opacity="0.35" stroke-width="2"/>
  <text class="i" x="220" y="308" text-anchor="start">•  open source</text>
  <text class="i" x="490" y="308" text-anchor="start">•  JavaScript</text>
  <text class="i" x="220" y="344" text-anchor="start">•  do-it-yourself systems</text>
  <text class="i" x="490" y="344" text-anchor="start">•  not checked by the FDA</text>

</g>
<g transform="translate(1040 0)">
  <text class="h" x="0" y="30" text-anchor="start">What we did</text>
  <rect class="box" x="0" y="52" width="230" height="84" rx="12"/>
  <text class="t" x="115.0" y="90.0" text-anchor="middle">oref0</text>
  <text class="s" x="115.0" y="118.0" text-anchor="middle">JavaScript, original</text>
  <rect class="main" x="355" y="52" width="230" height="84" rx="12"/>
  <text class="tg" x="470.0" y="90.0" text-anchor="middle">lean-oref0</text>
  <text class="s" x="470.0" y="118.0" text-anchor="middle">same logic, in Lean</text>
  <rect class="box" x="710" y="52" width="230" height="84" rx="12"/>
  <text class="t" x="825.0" y="90.0" text-anchor="middle">Binary</text>
  <text class="s" x="825.0" y="118.0" text-anchor="middle">compiled via C</text>
  <path class="line" d="M230 94 H347" marker-end="url(#head)"/>
  <text class="s" x="292" y="84" text-anchor="middle">AI agent</text>
  <path class="line" d="M585 94 H702" marker-end="url(#head)"/>
  <text class="s" x="646" y="84" text-anchor="middle">compile</text>
  <path class="line" d="M470 136 V164 M230 164 H710"/>
  <path class="line" d="M230 164 V178" marker-end="url(#head)"/>
  <path class="line" d="M710 164 V178" marker-end="url(#head)"/>
  <text class="s" x="458" y="156" text-anchor="end">AI agent proves</text>
  <rect class="main" x="0" y="186" width="460" height="232" rx="12"/>
  <text class="tg" x="230" y="222" text-anchor="middle">Safety rules</text>
  <text class="s" x="230" y="250" text-anchor="middle">from FDA research on insulin pumps</text>
  <text class="n" x="70" y="290" text-anchor="end">10</text>
  <text class="i" x="86" y="288" text-anchor="start">proved for every valid input</text>
  <text class="n" x="70" y="324" text-anchor="end">4</text>
  <text class="i" x="86" y="322" text-anchor="start">proved in part</text>
  <text class="no" x="70" y="358" text-anchor="end">1</text>
  <text class="i" x="86" y="356" text-anchor="start">does not hold: a finding</text>
  <text class="nm" x="70" y="392" text-anchor="end">6</text>
  <text class="i" x="86" y="390" text-anchor="start">still to prove</text>
  <rect class="main" x="480" y="186" width="460" height="232" rx="12"/>
  <text class="tg" x="710" y="222" text-anchor="middle">oref0’s tests, generalized</text>
  <text class="s" x="710" y="250" text-anchor="middle">116 tests; 59 state a general rule</text>
  <text class="n" x="550" y="290" text-anchor="end">52</text>
  <text class="i" x="566" y="288" text-anchor="start">proved for every valid input</text>
  <text class="nm" x="550" y="324" text-anchor="end">7</text>
  <text class="i" x="566" y="322" text-anchor="start">still to prove</text>

</g>
<g transform="translate(0 460)">
  <text class="h" x="0" y="30" text-anchor="start">How we tested against oref0</text>
  <rect class="box" x="0" y="52" width="455" height="372" rx="12"/>
  <text class="t" x="227" y="90" text-anchor="middle">Same input, same answer?</text>
  <rect class="box" x="20" y="136" width="110" height="52" rx="12"/>
  <text class="t" x="75.0" y="171.0" text-anchor="middle">input</text>
  <rect class="box" x="190" y="112" width="170" height="46" rx="12"/>
  <text class="t" x="275.0" y="144.0" text-anchor="middle">oref0</text>
  <rect class="main" x="190" y="170" width="170" height="46" rx="12"/>
  <text class="tg" x="275.0" y="202.0" text-anchor="middle">lean-oref0</text>
  <text class="t" x="405" y="178" text-anchor="middle" style="font-size:38px">=</text>
  <path class="line" d="M130 154 L182 137" marker-end="url(#head)"/>
  <path class="line" d="M130 170 L182 193" marker-end="url(#head)"/>
  <line x1="20" y1="272" x2="435" y2="272" stroke="#3a4350" stroke-width="2"/>
  <text class="s" x="20" y="304" text-anchor="start">oref0’s own test cases</text>
  <text x="20" y="342"><tspan class="bigs">148 / 148</tspan><tspan class="s" dx="12">identical</tspan></text>
  <text class="s" x="20" y="376" text-anchor="start">random inputs</text>
  <text x="20" y="412"><tspan class="bigs">100,000 / 100,000</tspan><tspan class="s" dx="12">identical</tspan></text>
  <rect class="box" x="485" y="52" width="455" height="372" rx="12"/>
  <text class="t" x="712" y="90" text-anchor="middle">Virtual patients</text>
  <rect class="box" x="505" y="126" width="120" height="72" rx="12"/>
  <text class="t" x="565.0" y="158.0" text-anchor="middle">Patient</text>
  <text class="s" x="565.0" y="186.0" text-anchor="middle">simulator</text>
  <rect class="box" x="675" y="112" width="170" height="46" rx="12"/>
  <text class="t" x="760.0" y="144.0" text-anchor="middle">oref0</text>
  <rect class="main" x="675" y="170" width="170" height="46" rx="12"/>
  <text class="tg" x="760.0" y="202.0" text-anchor="middle">lean-oref0</text>
  <text class="t" x="890" y="178" text-anchor="middle" style="font-size:38px">=</text>
  <path class="line" d="M625 154 L667 137" marker-end="url(#head)"/>
  <path class="line" d="M625 170 L667 193" marker-end="url(#head)"/>
  <path class="line" d="M760 216 V232 H565 V206" marker-end="url(#head)"/>
  <text class="s" x="665" y="258" text-anchor="middle">insulin: lean-oref0’s dose</text>
  <line x1="505" y1="272" x2="920" y2="272" stroke="#3a4350" stroke-width="2"/>
  <text class="s" x="505" y="304" text-anchor="start">30 patients, 512 runs, 12 hours of computing</text>
  <text class="s" x="505" y="330" text-anchor="start">with sensor faults and missed meals</text>
  <text class="bigs" x="505" y="384" text-anchor="start">220,608 / 220,608</text>
  <text class="s" x="505" y="412" text-anchor="start">decisions identical</text>

</g>
<g transform="translate(1040 460)">
  <text class="h" x="0" y="30" text-anchor="start">What we found in oref0</text>
  <text class="s" x="940" y="30" text-anchor="end">proved in Lean, reproduced in JavaScript</text>
  <rect class="hot" x="0" y="52" width="300" height="316" rx="12"/>
  <rect x="20" y="70" width="104" height="28" rx="14" fill="#2e1a08"/>
  <text class="pill" x="34" y="90" style="fill:#ff9f43">medium</text>
  <text class="t" x="20" y="136" text-anchor="start">Old reading</text>
  <text class="t" x="20" y="166" text-anchor="start">treated as new</text>
  <text class="s" x="20" y="204" text-anchor="start">No timestamp: its age</text>
  <text class="s" x="20" y="230" text-anchor="start">is NaN, never too old</text>
  <text class="bigo" x="20" y="290" text-anchor="start">NaN > 12</text>
  <text class="s" x="20" y="326" text-anchor="start">is false in JavaScript</text>
  <rect class="hot" x="320" y="52" width="300" height="316" rx="12"/>
  <rect x="340" y="70" width="104" height="28" rx="14" fill="#2e1a08"/>
  <text class="pill" x="354" y="90" style="fill:#ff9f43">medium</text>
  <text class="t" x="340" y="136" text-anchor="start">Missing setting</text>
  <text class="t" x="340" y="166" text-anchor="start">turns the limit off</text>
  <text class="s" x="340" y="204" text-anchor="start">No max basal: the limit</text>
  <text class="s" x="340" y="230" text-anchor="start">uses a missing value</text>
  <text class="bigo" x="340" y="290" text-anchor="start">min(…, NaN)</text>
  <text class="s" x="340" y="326" text-anchor="start">is NaN: no cap at all</text>
  <rect class="box" x="640" y="52" width="300" height="316" rx="12"/>
  <rect x="660" y="70" width="70" height="28" rx="14" fill="#222a33"/>
  <text class="pill" x="674" y="90" style="fill:#a7b0bd">low</text>
  <text class="t" x="660" y="136" text-anchor="start">Rounding goes</text>
  <text class="t" x="660" y="166" text-anchor="start">over the limit</text>
  <text class="s" x="660" y="204" text-anchor="start">Capped first, then</text>
  <text class="s" x="660" y="230" text-anchor="start">rounded up to a step</text>
  <text class="bigo" x="660" y="290" text-anchor="start">0.83 → 0.85</text>
  <text class="s" x="660" y="326" text-anchor="start">U/h, above the limit</text>
  <text class="s" x="470" y="400" text-anchor="middle">Severity is our estimate: medium = large overdose possible, but apps normally supply the data.</text>

</g>
</svg>
