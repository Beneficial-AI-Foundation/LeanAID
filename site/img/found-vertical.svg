<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1040" width="640" height="1040" role="img" aria-label="What we found: three gaps in oref0's own safety checks, each proved in Lean and reproduced by running the original. A reading with no timestamp counts as fresh: 3.5 U/h, the maximum rate, however old the reading. A missing maximum basal setting switches the limit off: 5.9 U/h for a usual rate of 0.9 U/h. Rounding can go over the limit: a limit of 0.83 U/h gives 0.85 U/h. In the virtual patients, the missing setting tripled the time in severe low glucose, from 1.6% to 4.8%.">
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #1b1d21; }
    .card { fill: #ffffff; stroke: #c9ccd1; stroke-width: 2; }
    .hot { fill: #fdf3e7; stroke: #b45309; stroke-width: 3; }
    .heading { font-size: 40px; font-weight: 700; }
    .title { font-size: 26px; font-weight: 700; }
    .body { font-size: 22px; fill: #5e636e; }
    .big { font-size: 40px; font-weight: 700; fill: #b45309; }
    .note { font-size: 22px; fill: #5e636e; }
  </style>

  <rect id="bg" width="640" height="1040" fill="#fbfbfa"/>
  <text class="heading" x="320" y="52" text-anchor="middle">What we found</text>
  <text class="note" x="320" y="92" text-anchor="middle">Three gaps in oref0’s own safety checks.</text>
  <text class="note" x="320" y="122" text-anchor="middle">Proved in Lean, reproduced by running the original.</text>

  <!-- card 1 -->
  <rect class="card" x="20" y="150" width="600" height="190" rx="18"/>
  <text class="title" x="48" y="196">Old reading treated as new</text>
  <text class="body" x="48" y="232">A glucose reading with no timestamp</text>
  <text class="body" x="48" y="260">is never seen as out of date.</text>
  <text class="big" x="48" y="316">3.5 U/h</text>
  <text class="body" x="230" y="314">maximum rate, however old</text>

  <!-- card 2 -->
  <rect class="card" x="20" y="360" width="600" height="190" rx="18"/>
  <text class="title" x="48" y="406">Missing setting turns the limit off</text>
  <text class="body" x="48" y="442">Without a maximum basal setting,</text>
  <text class="body" x="48" y="470">the cap is never applied.</text>
  <text class="big" x="48" y="526">5.9 U/h</text>
  <text class="body" x="230" y="524">for a usual rate of 0.9 U/h</text>

  <!-- card 3 -->
  <rect class="card" x="20" y="570" width="600" height="190" rx="18"/>
  <text class="title" x="48" y="616">Rounding goes over the limit</text>
  <text class="body" x="48" y="652">The dose is capped first, then rounded</text>
  <text class="body" x="48" y="680">to the pump’s step, which can round up.</text>
  <text class="big" x="48" y="736">0.83 → 0.85</text>
  <text class="body" x="320" y="734">U/h, above the limit</text>

  <!-- simulation -->
  <rect class="hot" x="20" y="790" width="600" height="230" rx="18"/>
  <text class="title" x="48" y="836">In the virtual patients</text>
  <text class="body" x="48" y="872">With the missing setting, in a closed loop:</text>
  <text class="body" x="48" y="900">time in severe low glucose (below 54 mg/dL),</text>
  <text class="body" x="48" y="928">average over 30 patients, 2 days each</text>
  <text class="big" x="48" y="990">1.6% → 4.8%</text>
  <text class="body" x="320" y="988">three times as much</text>
</svg>
