<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="What we found: three ways to make oref0's safety checks even more robust. They need unusual input, which the apps around oref0 normally supply correctly. A reading with no timestamp counts as fresh: its age is NaN (not a number), and in JavaScript the check NaN > 12 minutes is false, so it is never too old. Needs unusual input. Without a maximum basal setting, the limit does not apply: the limit is computed as min(…, NaN), which is NaN, so the cap never applies. Needs unusual input. Rounding can go over the limit: a limit of 0.83 U/h gives 0.85 U/h. Very small effect. Each is proved in Lean and reproduced by running the original oref0.">
  <style>
    text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #1b1d21; }
    .card { fill: #ffffff; stroke: #c9ccd1; stroke-width: 2; }
    .hot { fill: #fdf3e7; stroke: #b45309; stroke-width: 3; }
    .heading { font-size: 40px; font-weight: 700; }
    .title { font-size: 27px; font-weight: 700; }
    .body { font-size: 22px; fill: #5e636e; }
    .big { font-size: 44px; font-weight: 700; fill: #374151; }
    .note { font-size: 22px; fill: #5e636e; }
    .pill { font-size: 20px; font-weight: 700; }
    .strong { font-size: 26px; font-weight: 700; }
  </style>

  <rect id="bg" width="1200" height="610" fill="#fbfbfa"/>
  <text class="heading" x="600" y="52" text-anchor="middle">What we found</text>
  <text class="note" x="600" y="92" text-anchor="middle">Three ways to make oref0’s safety checks even more robust. Each is proved in Lean and reproduced.</text>

  <!-- card 1 -->
  <rect class="card" x="40" y="125" width="355" height="370" rx="18"/>
  <text class="title" x="70" y="218">Undated reading</text>
  <text class="title" x="70" y="252">counts as recent</text>
  <text class="body" x="70" y="298">With no timestamp, a glucose</text>
  <text class="body" x="70" y="328">reading’s age is NaN (not a</text>
  <text class="body" x="70" y="358">number): never too old.</text>
  <text class="big" x="70" y="430">NaN &gt; 12</text>
  <text class="body" x="70" y="466">is false in JavaScript</text>

  <rect x="70" y="147" width="222" height="34" rx="17" fill="#eceef0"/>
  <text class="pill" x="86" y="171" style="fill:#5e636e">Needs unusual input</text>

  <!-- card 2 -->
  <rect class="card" x="422" y="125" width="355" height="370" rx="18"/>
  <text class="title" x="452" y="218">Missing setting skips</text>
  <text class="title" x="452" y="252">the limit</text>
  <text class="body" x="452" y="298">Without a maximum basal</text>
  <text class="body" x="452" y="328">setting, the limit is computed</text>
  <text class="body" x="452" y="358">from a missing value.</text>
  <text class="big" x="452" y="430">min(…, NaN)</text>
  <text class="body" x="452" y="466">is NaN: the cap never applies</text>

  <rect x="452" y="147" width="222" height="34" rx="17" fill="#eceef0"/>
  <text class="pill" x="468" y="171" style="fill:#5e636e">Needs unusual input</text>

  <!-- card 3 -->
  <rect class="card" x="805" y="125" width="355" height="370" rx="18"/>
  <text class="title" x="835" y="218">Rounding can go</text>
  <text class="title" x="835" y="252">slightly over the limit</text>
  <text class="body" x="835" y="298">The dose is capped first,</text>
  <text class="body" x="835" y="328">then rounded to the pump’s</text>
  <text class="body" x="835" y="358">step, which can round up.</text>
  <text class="big" x="835" y="430">0.83 → 0.85</text>
  <text class="body" x="835" y="466">U/h, above the limit</text>

  <rect x="835" y="147" width="190" height="34" rx="17" fill="#eceef0"/>
  <text class="pill" x="851" y="171" style="fill:#5e636e">Very small effect</text>

  <text class="note" x="600" y="554" text-anchor="middle">Unusual input: a reading without a date or a missing setting, which the apps normally supply.</text>
  <text class="note" x="600" y="584" text-anchor="middle">Very small effect: at most half a pump step (0.025 U/h) over the limit.</text>
</svg>
